# 桌面安装包产物构建
#
# 触发方式：
#   - 打 tag（v*）：五个目标全量构建，并创建 GitHub Release。这是主路径。
#   - 手动 workflow_dispatch：用三个开关选子集，便于单独重跑某个平台。
#
# 注意：这不是交叉编译。每个 job 都在对应 OS 的原生 runner 上编自己那个平台。
# node-pty 是原生模块，真正的跨平台交叉编译走不通；标准做法就是原生 runner 并行编。
# 私有仓库拿不到 macos/windows 托管 runner，本流程按公开仓库配置。

name: build-desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_linux:
        description: "构建 Linux（x64 + arm64）"
        required: false
        type: boolean
        default: true
      build_mac:
        description: "构建 macOS（arm64 + x64）"
        required: false
        type: boolean
        default: true
      build_win:
        description: "构建 Windows x64"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  # 发布安装包必须显式使用生产后端和正式应用身份；否则默认 test 会生成 Preview/_TEST 文件名，
  # 与 publish 阶段要求的 ZCode-${version}-... 文件名不一致。
  ZCODE_ENV: production
  ZCODE_PREVIEW_IDENTITY: "0"
  # 桌面安装包不依赖 mock-cdn remote 资产（远端资源生产态运行时从 CDN 下载）。
  # 开关见 prepare-runtime-assets.mjs，作者就是为 CI 加的：无条件准备 remote 资产
  # 会把 CI 时间串行拉高到逼近 1 小时上限。
  ZCODE_SKIP_REMOTE_ASSETS: "1"

jobs:
  build-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.build_linux == true
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      # Linux 走纯打包（AppImage/deb/rpm/zst），不涉及签名和 wine，
      # x64 runner 上交叉编 arm64 是安全的。
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pacman packaging tools
        # pacman target 由 fpm 生成 .MTREE，依赖 bsdtar（libarchive-tools）。
        # ubuntu-24.04 镜像默认不带；AppImage/deb/rpm 三个 target 不需要它。
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libarchive-tools

      - name: Build installer
        # bundle:desktop 内部已含 pnpm run 的分隔符，这里再加 -- 会被原样透传成字符串参数。
        # --publish never 关闭 electron-builder 的隐式发布（tag push 会触发），产物由 publish job 统一发。
        run: pnpm bundle:desktop --os linux --arch ${{ matrix.arch }} --publish never

      - name: Show generated installers
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: find packages/desktop/dist -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Validate Linux installers
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          find packages/desktop/dist -maxdepth 1 -type f -printf '%f\n' | sort
          for ext in AppImage deb rpm pkg.tar.zst; do
            asset="packages/desktop/dist/ZCode-${VERSION}-linux-${ARCH}.${ext}"
            test -s "$asset" || { echo "Missing Linux installer: $asset" >&2; exit 1; }
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: packages/desktop/dist/*
          if-no-files-found: error
          retention-days: 30

  build-mac:
    if: github.event_name != 'workflow_dispatch' || inputs.build_mac == true
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      # macos-15 是 arm64 runner，macos-14 是 x64 runner。各自在自己架构上编，
      # 不交叉：dmg-builder 和 arm64/x64 原生产物在跨架构时容易出 Mach-O 问题。
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer
        run: pnpm bundle:desktop --os mac --arch ${{ matrix.arch }} --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-${{ matrix.arch }}
          path: packages/desktop/dist/*
          if-no-files-found: error
          retention-days: 30

  build-win:
    if: github.event_name != 'workflow_dispatch' || inputs.build_win == true
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer
        run: pnpm bundle:desktop --os win --arch x64 --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-win-x64
          path: packages/desktop/dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Create release
    needs: [build-linux, build-mac, build-win]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # gh release create --verify-tag 要用 git 本地核对 tag 对象；job 默认不 checkout，
          # 目录里没有 .git 会直接 fatal。fetch-depth 0 同时拉全所有 tag。
          fetch-depth: 0

      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${GITHUB_REF_NAME#v}"
          assets=()

          # 下载产物可能包含 linux-*-unpacked 等辅助目录；逐个收集正式安装包，避免 gh 将目录当作上传文件。
          for arch in x64 arm64; do
            for ext in AppImage deb rpm pkg.tar.zst; do
              assets+=("release-assets/ZCode-${VERSION}-linux-${arch}.${ext}")
            done
            for ext in dmg zip; do
              assets+=("release-assets/ZCode-${VERSION}-mac-${arch}.${ext}")
            done
          done
          assets+=("release-assets/ZCode-${VERSION}-win-x64.exe")

          for asset in "${assets[@]}"; do
            test -s "$asset" || { echo "Missing release installer: $asset" >&2; exit 1; }
          done

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "$VERSION" \
              --generate-notes \
              --verify-tag \
              --repo "$GITHUB_REPOSITORY"
          fi
