# 桌面安装包 + 远程连接资源 产物构建
#
# 触发方式：
#   - 打 tag（v*）：全量构建，并创建 GitHub Release。这是主路径。
#   - 手动 workflow_dispatch：用开关选子集，便于单独重跑某类产物。
#
# 架构：安装包构建与远程资源构建完全解耦为独立 job 并行跑，
# 任意一方失败不阻断另一方；publish 需两类 artifact 齐全才发布。

name: build-desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_installer_linux:
        description: "构建 Linux 安装包（x64 + arm64）"
        required: false
        type: boolean
        default: true
      build_installer_mac:
        description: "构建 macOS 安装包（arm64 + x64）"
        required: false
        type: boolean
        default: true
      build_installer_win:
        description: "构建 Windows 安装包（x64）"
        required: false
        type: boolean
        default: true
      build_remote_assets:
        description: "构建远程连接资源（4 平台并行：linux-x64/arm64, darwin-x64/arm64）"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  # 发布安装包必须显式使用生产后端和正式应用身份；否则默认 test 会生成 Preview/_TEST 文件名，
  # 与 publish 阶段要求的 WeCode-${version}-... 文件名不一致。
  ZCODE_ENV: production
  ZCODE_PREVIEW_IDENTITY: "0"
  # 远程资源直接从当前 tag 的 GitHub Release 下载，不再走 zcode CDN。
  # URL 已包含 tag；desktop runtime 会识别该形式并直接拼接资产名。
  ZCODE_CDN_BASE_URL: ${{ startsWith(github.ref, 'refs/tags/v') && format('https://github.com/{0}/releases/download/{1}', github.repository, github.ref_name) || '' }}
  ZCODE_REMOTE_ASSET_CDN_BASE_URL: ${{ startsWith(github.ref, 'refs/tags/v') && format('https://github.com/{0}/releases/download/{1}', github.repository, github.ref_name) || '' }}

# ============================================================
# 1) 安装包构建：每平台一个独立 job，互不依赖
# ============================================================

jobs:
  build-installer-linux-x64:
    if: github.event_name != 'workflow_dispatch' || inputs.build_installer_linux == true
    name: Installer Linux x64
    runs-on: ubuntu-24.04
    env:
      ZCODE_SKIP_REMOTE_ASSETS: "1"
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pacman packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libarchive-tools

      - name: Build installer
        run: pnpm bundle:desktop --os linux --arch x64 --publish never

      - name: Show generated installers
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: find packages/desktop/dist -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Validate Linux installers
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: x64
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          find packages/desktop/dist -maxdepth 1 -type f -printf '%f\n' | sort
          for ext in AppImage deb rpm pkg.tar.zst; do
            asset="packages/desktop/dist/WeCode-${VERSION}-linux-${ARCH}.${ext}"
            test -s "$asset" || { echo "Missing Linux installer: $asset" >&2; exit 1; }
          done

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x64
          # actions/upload-artifact 使用 @actions/glob，不执行 shell brace expansion。
          # 每个扩展名必须单独列出，否则构建成功后会在上传阶段报找不到文件。
          path: |
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 30

  build-installer-linux-arm64:
    if: github.event_name != 'workflow_dispatch' || inputs.build_installer_linux == true
    name: Installer Linux arm64
    runs-on: ubuntu-24.04
    env:
      ZCODE_SKIP_REMOTE_ASSETS: "1"
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pacman packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libarchive-tools

      - name: Build installer
        run: pnpm bundle:desktop --os linux --arch arm64 --publish never

      - name: Show generated installers
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: find packages/desktop/dist -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Validate Linux installers
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: arm64
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          find packages/desktop/dist -maxdepth 1 -type f -printf '%f\n' | sort
          for ext in AppImage deb rpm pkg.tar.zst; do
            asset="packages/desktop/dist/WeCode-${VERSION}-linux-${ARCH}.${ext}"
            test -s "$asset" || { echo "Missing Linux installer: $asset" >&2; exit 1; }
          done

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-arm64
          path: |
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 30

  build-installer-mac-arm64:
    if: github.event_name != 'workflow_dispatch' || inputs.build_installer_mac == true
    name: Installer macOS arm64
    runs-on: macos-15
    env:
      ZCODE_SKIP_REMOTE_ASSETS: "1"
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer
        run: pnpm bundle:desktop --os mac --arch arm64 --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-arm64
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 30

  build-installer-mac-x64:
    if: github.event_name != 'workflow_dispatch' || inputs.build_installer_mac == true
    name: Installer macOS x64
    runs-on: macos-14
    env:
      ZCODE_SKIP_REMOTE_ASSETS: "1"
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer
        run: pnpm bundle:desktop --os mac --arch x64 --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-x64
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 30

  build-installer-win-x64:
    if: github.event_name != 'workflow_dispatch' || inputs.build_installer_win == true
    name: Installer Windows x64
    runs-on: windows-2022
    env:
      ZCODE_SKIP_REMOTE_ASSETS: "1"
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer
        run: pnpm bundle:desktop --os win --arch x64 --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-win-x64
          path: packages/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

# ============================================================
# 2) 远程连接资源构建：独立 matrix，4 平台并行
# ============================================================

  build-remote-assets:
    if: github.event_name != 'workflow_dispatch' || inputs.build_remote_assets == true
    name: Remote Assets ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            mock_platform: linux-x64
          - platform: linux-arm64
            runner: ubuntu-24.04
            mock_platform: linux-arm64
          - platform: darwin-x64
            runner: macos-14
            mock_platform: darwin-x64
          - platform: darwin-arm64
            runner: macos-15
            mock_platform: darwin-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare remote assets (mock-cdn)
        # 只构建当前平台对应的 mock-cdn 产物，避免重复下载/编译
        env:
          ZCODE_REMOTE_ASSET_PLATFORMS: ${{ matrix.mock_platform }}
        run: |
          pnpm prepare:remote-assets
          pnpm pack:remote-assets

      - name: Upload remote assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-assets-${{ matrix.platform }}
          path: packages/desktop/dist/remote-assets/**/*
          if-no-files-found: error
          retention-days: 30

# ============================================================
# 3) 发布：需所有安装包 job + 远程资源 job 全部成功
# ============================================================

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Create Release
    needs:
      - build-installer-linux-x64
      - build-installer-linux-arm64
      - build-installer-mac-arm64
      - build-installer-mac-x64
      - build-installer-win-x64
      - build-remote-assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${GITHUB_REF_NAME#v}"
          assets=()

          # --- 收集安装包 ---
          for arch in x64 arm64; do
            for ext in AppImage deb rpm pkg.tar.zst; do
              assets+=("release-assets/WeCode-${VERSION}-linux-${arch}.${ext}")
            done
            for ext in dmg zip; do
              assets+=("release-assets/WeCode-${VERSION}-mac-${arch}.${ext}")
            done
          done
          assets+=("release-assets/WeCode-${VERSION}-win-x64.exe")

          for asset in "${assets[@]}"; do
            test -s "$asset" || { echo "Missing release installer: $asset" >&2; exit 1; }
          done

          # --- 收集远程连接资源（4 平台 × 组件 + manifest）---
          remote_platforms=(linux-x86_64 linux-aarch64 darwin-x64 darwin-arm64)
          found_remote=0
          for platform in "${remote_platforms[@]}"; do
            manifest="$(find release-assets -type f -name "manifest-${platform}.json" -print -quit)"
            test -s "$manifest" || { echo "Missing remote manifest: ${platform}" >&2; exit 1; }
            assets+=("$manifest")
            while IFS= read -r file; do
              [[ -n "$file" ]] && assets+=("$file")
            done < <(find release-assets -type f -name "remote-${platform}-*.tar.gz" -print)
            found_remote=$((found_remote + 1))
          done
          echo "Found remote assets for ${found_remote} platforms"

          # 校验：tag push 时要求远程资源全平台齐全
          if [[ $found_remote -ne 4 ]]; then
            echo "ERROR: Expected 4 remote asset platforms, got ${found_remote}" >&2
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "$VERSION" \
              --generate-notes \
              --verify-tag \
              --repo "$GITHUB_REPOSITORY"
          fi
